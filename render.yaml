services:
  - type: web
    name: bot-isib
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_SENDER_NAME
        sync: false
      - key: AUDIT_CHANNEL_ID
        sync: false
      - key: VALIDATION_CHANNEL_ID
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PGPORT
        value: "5432"
      - key: PGHOST
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
